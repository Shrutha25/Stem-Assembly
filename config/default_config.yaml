# Assembly Trainer — default configuration.
# Single source of truth for every tunable in the pipeline (see build plan §8).
# Per-step fields override the `app`/`escalation` defaults below when present;
# omit a per-step field to fall back to the matching default.
#
# NOTE: `training/export.py --update-config` rewrites this file with yaml.dump
# and DESTROYS every comment below. Re-export without that flag and edit
# model_path by hand, or restore the comments afterwards.

model_path: models/best.onnx  # updated by training/export.py after a real train run

# Second, optional model: a corner-keypoint pose detector for block_7x7,
# used only by steps 1/2's hole-position check (see hole_template below and
# assembly_trainer/hole_position.py). Missing/commented out = hole-position
# checking is silently disabled and steps 1/2 behave exactly as before
# (count-only gating) -- uncomment once training/train_pose.py has produced
# a real model and training/export.py --config-field pose_model_path has run.
pose_model_path: models/block-pose.onnx  # filename MUST contain "-pose" (hyphen) -- see hole_position.py note

classes:
  # `peg` is short_peg and long_peg MERGED into one class. They are the same
  # object to a detector: median longest side 0.048 vs 0.063 with almost
  # fully overlapping ranges, and the best possible single size threshold
  # over all 1372 instances tops out at 78.9% accuracy (39% of short pegs
  # misread). Position doesn't separate them either -- median offset from
  # the block centre is +0.01 vs -0.02 block-widths. Keeping them apart
  # meant whichever class had the larger prior swallowed the other: with
  # long_peg at 2.6:1 the pre-merge model called every peg long_peg and
  # short_peg was never detected at all.
  #
  # Steps 1/2 now gate on peg COUNT instead of peg identity. The 7x7 block
  # permanently carries exactly 2 long pegs (93% of training images show
  # exactly 2; it is a fixture of the block), so the baseline is 2 and each
  # short peg the trainee adds is +1: step 1 -> 3, step 2 -> 4. 98% of
  # step-1/2 training images land on that 2/3/4 ladder. This also fixes the
  # original bug that adding long_peg was meant to solve -- the block's own
  # fixture pegs reading as short_peg and satisfying step 1 before the
  # trainee touched anything -- structurally rather than by naming, since a
  # bare block now counts 2 and cannot satisfy a requirement of 3.
  #
  # Both motor-lead classes are gone. motor_lead_loose went first (0.21 mAP:
  # a loose wire's tip can be anywhere, too high-variance to learn).
  # motor_lead_connected followed when the wiring step was dropped entirely
  # -- the PeeCee now arrives already wired to the motors, so no trainee
  # action involves the leads and no step requires them. It was also the
  # weakest surviving class by far (81 instances, and zero live detections
  # even at conf 0.05). Note the wires ARE physically in frame from step 3
  # onward, attached to the PeeCee: they must be treated as part of the
  # `peecee` class's appearance when labeling, not as their own thing.
  #
  # All four step<N>_wrong_orientation classes were also removed, from both
  # this list and the training labels. steps 1/2's version turned out to mean
  # POSITION (which hole) rather than a visual attribute -- a peg's crop
  # doesn't change based on which hole it sits in -- and that is handled
  # geometrically by hole_template/target_hole instead. steps 3/4's were
  # dropped afterwards.
  - peg
  - block_7x7
  - block_7x14
  - peecee    # the PeeCee, motor wires attached (they arrive pre-wired)

app:
  confidence_threshold: 0.60
  inference_interval_ms: 200
  # Widened from 10/0.7 after real-hardware testing: a trainee's hands
  # moving parts around in frame produce brief bursts of noisy/overlapping
  # class detections, and a short window could satisfy a step's stability
  # check on that noise alone (observed advancing through several steps in
  # under a minute with nothing actually assembled). 15 frames @ 0.85 needs
  # ~2.5s of consistently correct reads at inference_interval_ms=200, which
  # a genuine placement holds through but a motion-blur/occlusion burst won't.
  stability_window_frames: 15
  stability_pass_ratio: 0.85
  # §7: highest resolution the model/hardware can sustain at the target
  # inference rate — start high (960/1280), not YOLO's 640 default. Shared
  # by training/train.py and the live detector so they can't drift apart.
  imgsz: 960
  # Margin (as a ratio of the assembly bbox's own size) added around the
  # growing-assembly bounding box to form the "placement ROI" that a step's
  # new parts must land inside of (build plan §4 closing note).
  assembly_roi_margin_ratio: 0.35

camera:
  device_index: 1
  width: 1920
  height: 1080
  auto_exposure: true
  # Settle time for auto-exposure/white-balance after opening — grabbing a
  # frame immediately after open() can catch it mid-convergence (dark or
  # blown out); this webcam needed ~2-2.5s to settle in practice.
  warmup_seconds: 2.5
  # Optional fixed zone (normalized 0-1 coords: x, y, w, h) covering the
  # fixture/workstation area. Used as the base placement ROI for step 1
  # (before any assembly bbox exists yet) and as a fallback bound thereafter.
  workstation_roi: {x: 0.10, y: 0.10, w: 0.8, h: 0.8}

escalation:
  # DEMO TIMINGS (10/20/30). Production values were 20/45/90 -- restore those
  # for real use: 30s to a trainer alert is far too eager on a genuine
  # station, where a trainee pausing to think would summon help constantly.
  # Shortened so escalation is actually observable during a review rather
  # than needing a 90-second wait. Must stay strictly increasing (validated
  # in config.py).
  tier_1_reference_image_after_seconds: 10
  tier_2_reference_video_after_seconds: 20
  tier_3_trainer_alert_after_seconds: 30
  # v1: simple elapsed-time-only timers (per build plan §6). Left as an
  # explicit hook, not implemented — flip on later if needed.
  pause_on_partial_progress: false

# Hole-position template for steps 1/2's target_hole check (see
# assembly_trainer/hole_position.py). Coordinates are normalized 0-1 in
# the block's own canonical frame, projected to pixels via the pose model's
# four detected corners.
hole_template:
  edge_a:
    - {name: edge_a_hole1, x: 0.0714, y: 0.0}
    - {name: edge_a_hole2, x: 0.2143, y: 0.0}
    - {name: edge_a_hole3, x: 0.3571, y: 0.0}
    - {name: edge_a_hole4, x: 0.5000, y: 0.0}
    - {name: edge_a_hole5, x: 0.6429, y: 0.0}
    - {name: edge_a_hole6, x: 0.7857, y: 0.0}
    - {name: edge_a_hole7, x: 0.9286, y: 0.0}
  edge_b:
    - {name: edge_b_hole1, x: 0.0714, y: 1.0}
    - {name: edge_b_hole2, x: 0.2143, y: 1.0}
    - {name: edge_b_hole3, x: 0.3571, y: 1.0}
    - {name: edge_b_hole4, x: 0.5000, y: 1.0}
    - {name: edge_b_hole5, x: 0.6429, y: 1.0}
    - {name: edge_b_hole6, x: 0.7857, y: 1.0}
    - {name: edge_b_hole7, x: 0.9286, y: 1.0}

# The build is FOUR steps. The original step 5 (wire both motor leads into
# the PeeCee, build plan §5) has been REMOVED: the PeeCee now arrives already
# wired to the motors, so the trainee's last action is seating it, and step 4
# is the end of the sequence.
#
# That step was also unsatisfiable as written, independently of any detector
# quality. Its `require_roi_empty_first` rule made lead_2 wait for the
# connector zone to read EMPTY of connected leads before it would confirm --
# but lead 1 stays plugged in, so the zone never empties and the step could
# only ever pass on detector flicker. The anti-double-count intent was right;
# the mechanism was not. If wiring is ever reinstated, gate it on COUNT
# (lead 1 at >=1, lead 2 at >=2) the way steps 1/2 count pegs, rather than on
# a reset. The `sequential_roi` machinery in state_machine.py is left in
# place but is now dead code -- no step declares that type.
steps:
  - id: 1
    name: "Fix peg to the vertex of edge opposite to the wheel of 7x7 block"
    requires: {block_7x7: 1, peg: 3}   # 2 fixture long pegs + 1 placed
    # LOWERED to 0.20 on 2026-08-26 by explicit request (0.45 -> 0.35 -> 0.20),
    # because pegs that detected fine earlier stopped clearing the threshold
    # at the live station.
    #
    # Exact-peg-count accuracy on the val set (203 labelled images, current
    # model), for the record -- this measurement does NOT favour 0.35:
    #        all    2 pegs  3 pegs  4 pegs   overcounts (pred > gt)
    #   0.15  81%     67%     61%     81%       33
    #   0.20  84%     69%     61%     93%       27   <- current
    #   0.25  85%     70%     69%     93%       23
    #   0.30  89%     81%     69%    100%       16
    #   0.35  90%     85%     69%     93%       12
    #   0.40  90%     85%     69%     87%        8
    #   0.45  89%     81%     73%     87%        7
    #   0.50  87%     78%     65%     81%        5
    #   0.60  71%     58%     30%     18%        2
    #
    # 0.45 was the peak for the 3-peg state (73% vs 69%) -- step 1's own
    # completion condition -- and had fewer OVERCOUNTS. Overcounts are the
    # dangerous error: they falsely complete a step (a bare block reading 3
    # pegs satisfies step 1 before the trainee has done anything), whereas an
    # undercount merely stalls and is obvious to the trainee. Lowering the
    # threshold trades stalls for false completions.
    #
    # The real ceiling is ~73% at ANY threshold, so tuning this cannot fix
    # missed pegs. What actually moves it: camera distance (a 45px peg at
    # imgsz 960 is marginal -- moving the block nearer cleared steps 1/2 on
    # the spot), scene brightness (black pegs on a dim mat lose all detail),
    # and training data at foreshortened angles. 0.60 is a cliff -- counts
    # collapse above it. Re-run the sweep before changing this again.
    confidence_threshold: 0.20
    # Set to a hole name from hole_template above (e.g. edge_a_hole3) once
    # pose_model_path is trained/uncommented, and update `name` above to
    # name the actual required hole instead of "one edge". Left unset for
    # now = no hole-position check, existing count-only gating (unaffected).
    # target_hole: edge_a_hole?
    reference_image: assets/reference/step_01_correct.jpg
    reference_video: assets/reference/step_01_correct.mp4

  - id: 2
    name: "Fix peg to the other vertex of same edge"
    requires: {block_7x7: 1, peg: 4}   # 2 fixture long pegs + 2 placed
    confidence_threshold: 0.20         # see step 1
    # target_hole: edge_b_hole?
    reference_image: assets/reference/step_02_correct.jpg
    reference_video: assets/reference/step_02_correct.mp4

  - id: 3
    name: "Attach 7x14 block edge on 7x7 block on the pegs you just attached such that 7x7 block is centre aligned (wheels and motors should be down)"
    # peg intentionally NOT required from here on: placing the 7x14 block on
    # top physically occludes both pegs. Measured in the training set -- of
    # images showing the 7x14 block, only 7% have a visible (labelable) peg,
    # and at steps 4/5 it is 0%. Requiring them here was unsatisfiable no
    # matter how good the detector is: the pegs are under the block. Their
    # presence is already verified by steps 1 and 2, which cannot be skipped
    # to reach this step.
    requires: {block_7x7: 1, block_7x14: 1}
    # Both blocks merely being in the placement zone is NOT enough -- the 7x14
    # has to be fixed ONTO the 7x7. Without this the step completed as soon as
    # a loose 7x14 was visible anywhere nearby, before the trainee had
    # attached anything (exactly the problem require_seated solves one step
    # later for the PeeCee). Attachment is judged geometrically; see
    # gating.evaluate_attached and _ATTACHED_MAX_CENTRE_DIST.
    require_attached_to: {block_7x14: block_7x7}
    reference_image: assets/reference/step_03_correct.jpg
    reference_video: assets/reference/step_03_correct.mp4

  # FINAL STEP. The PeeCee arrives pre-wired to the motors, so seating it is
  # the last thing the trainee does.
  - id: 4
    name: "Sit the yellow Peecee on 7x7 block between pegs and 7x14 block"
    requires: {block_7x7: 1, block_7x14: 1, peecee: 1}   # peg occluded -- see step 3
    # WITHOUT THIS, STEP 4 COMPLETES ITSELF. The PeeCee is already in frame
    # during step 3 (unseated, beside the assembly), so `peecee: 1` is
    # satisfied the instant step 3 ends and the trainee never has to seat it.
    # Same shape of bug as the block's 2 fixture pegs satisfying step 1.
    #
    # Seating is a spatial relation, so it is decided geometrically rather
    # than by a class -- a tight crop of the PeeCee looks identical seated or
    # lying beside the blocks, exactly like a peg's crop not changing with
    # which hole it is in. See gating.evaluate_seated for the rule and the
    # measurement behind it (192 labelled frames, 98.4% with zero false
    # positives). Deliberately NOT an orientation class: "upright" is only a
    # proxy for "seated" and breaks as soon as an upright-but-unseated PeeCee
    # appears in step 3.
    require_seated: true
    reference_image: assets/reference/step_04_correct.jpg
    reference_video: assets/reference/step_04_correct.mp4
